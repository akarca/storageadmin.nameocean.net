[program:garage]
command=/usr/local/bin/garage -c /root/garage-storage/garage.toml server --single-node
directory=/root/garage-storage
user=root
autostart=true
autorestart=true
redirect_stderr=true
stopsignal=TERM
stdout_logfile=/var/log/garage.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3

[program:garage-webui]
command=/usr/local/bin/garage-webui
directory=/root/garage-storage
user=root
autostart=true
autorestart=true
redirect_stderr=true
stopsignal=TERM
stdout_logfile=/var/log/garage-webui.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
environment=API_BASE_URL="http://127.0.0.1:3903",API_ADMIN_KEY="UkLeGWEvHnXBqnueR3ISEMWpOnm40jH2tM2HnnL/0F4=",S3_ENDPOINT_URL="http://127.0.0.1:3900",S3_REGION="garage"